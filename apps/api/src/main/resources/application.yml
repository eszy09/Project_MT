spring:
  application:
    name: project-mt-api
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${API_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: Project_MT API
    description: Backend API for Project_MT

project-mt:
  client-url: ${CLIENT_URL:http://localhost:3000}
