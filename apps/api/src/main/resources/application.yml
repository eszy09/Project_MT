springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

logging:
  level:
    org.springframework: INFO
  structured:
    format:
      console: ecs

spring:
  application:
    name: project-mt-api
  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/project_mt}
    username: ${DATABASE_USERNAME:project_mt}
    password: ${DATABASE_PASSWORD:local-development-only}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      minimum-idle: ${DATABASE_MIN_IDLE:1}
      connection-timeout: 30000

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    validate-migration-naming: true
    clean-disabled: true
    out-of-order: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:https://project-mt.invalid/}
          audiences: ${OIDC_AUDIENCE:https://api.project-mt}

server:
  port: ${API_PORT:8080}
  shutdown: graceful

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: Project_MT API
    description: Backend API for Project_MT

project-mt:
  client-url: ${CLIENT_URL:http://localhost:3000}
  media:
    bucket: ${S3_BUCKET:project-mt-local}
    region: ${S3_REGION:us-east-1}
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:project_mt_minio}
    secret-key: ${S3_SECRET_KEY:local-development-only}
    force-path-style: ${S3_FORCE_PATH_STYLE:true}
    max-file-size-bytes: ${MEDIA_MAX_FILE_SIZE_BYTES:10485760}
    upload-url-ttl-seconds: ${MEDIA_UPLOAD_URL_TTL_SECONDS:300}
