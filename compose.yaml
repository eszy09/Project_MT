name: project-mt

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-project_mt}
      POSTGRES_USER: ${POSTGRES_USER:-project_mt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - backend

  object-storage:
    image: quay.io/minio/minio:RELEASE.2025-06-13T11-33-47Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-project_mt_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-development-only}
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - object_storage_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:9000/minio/health/live",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - backend

  object-storage-init:
    profiles:
      - tools
    image: quay.io/minio/mc:RELEASE.2025-05-21T01-59-54Z
    restart: "no"
    depends_on:
      object-storage:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-project_mt_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-development-only}
      S3_BUCKET: ${S3_BUCKET:-project-mt-local}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://object-storage:9000
      \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" &&
      mc mb --ignore-existing \"local/$${S3_BUCKET}\" &&
      mc anonymous set none \"local/$${S3_BUCKET}\"
      "
    networks:
      - backend

volumes:
  postgres_data:
  object_storage_data:

networks:
  backend:
    driver: bridge

